<style>
  /* ============ rainism — RAINY EDIT (MVP core screen mockup) ============ */
  :root{
    /* rainy morning · ivory ground (light) */
    --bg:#E9E2D3;          /* warm ivory studio ground */
    --paper:#F5F0E6;       /* the screen: creamy ivory */
    --paper-2:#FBF8F0;     /* lifted plate */
    --ink:#211E17;         /* warm near-black */
    --ink-soft:#6B6254;    /* warm taupe */
    --line:rgba(33,30,23,.15);
    --line-soft:rgba(33,30,23,.08);
    --accent:#1E6A88;      /* rain blue — cool counterpoint to ivory */
    --accent-ink:#FFFFFF;
    --stamp:#1E6A88;
    --shadow:rgba(60,48,28,.22);

    --serif:"Didot","Bodoni 72","Hoefler Text","AppleMyungjo","Nanum Myeongjo",Georgia,"Times New Roman",serif;
    --sans:"Helvetica Neue","Inter","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12100A; --paper:#1A160F; --paper-2:#241F16;
      --ink:#EFE9DC; --ink-soft:#A39A87;
      --line:rgba(239,233,220,.15); --line-soft:rgba(239,233,220,.08);
      --accent:#6FB2CE; --accent-ink:#12100A; --stamp:#6FB2CE;
      --shadow:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="light"]{
    --bg:#E9E2D3; --paper:#F5F0E6; --paper-2:#FBF8F0;
    --ink:#211E17; --ink-soft:#6B6254;
    --line:rgba(33,30,23,.15); --line-soft:rgba(33,30,23,.08);
    --accent:#1E6A88; --accent-ink:#FFFFFF; --stamp:#1E6A88; --shadow:rgba(60,48,28,.22);
  }
  :root[data-theme="dark"]{
    --bg:#12100A; --paper:#1A160F; --paper-2:#241F16;
    --ink:#EFE9DC; --ink-soft:#A39A87;
    --line:rgba(239,233,220,.15); --line-soft:rgba(239,233,220,.08);
    --accent:#6FB2CE; --accent-ink:#12100A; --stamp:#6FB2CE; --shadow:rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  .stage{
    min-height:100vh; width:100%;
    background:radial-gradient(120% 80% at 50% -8%, color-mix(in srgb,#fff 34%, var(--bg)), var(--bg) 64%);
    color:var(--ink); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:40px 16px 34px; position:relative; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------- phone ---------------- */
  .phone{
    position:relative; z-index:1;
    width:min(94vw,392px); border-radius:44px;
    background:var(--paper);
    box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 10%,transparent) inset,
               0 40px 80px -30px var(--shadow),
               0 12px 30px -18px var(--shadow);
    border:1px solid var(--line-soft);
    padding:12px;
  }
  .notch{width:120px; height:26px; margin:0 auto 4px; position:relative}
  .notch::before{content:""; position:absolute; left:50%; top:9px; transform:translateX(-50%);
    width:52px; height:5px; border-radius:3px; background:color-mix(in srgb,var(--ink) 20%,transparent)}
  .screen{background:var(--paper); border-radius:33px; overflow:hidden;
    display:flex; flex-direction:column}

  /* ---------------- top: weather lives here ---------------- */
  .top{padding:14px 22px 0; display:flex; flex-direction:column; gap:10px}
  .brandrow{display:flex; align-items:center; justify-content:space-between}
  .wordmark{font-family:var(--sans); font-weight:700; font-size:13px; letter-spacing:.26em;
    text-transform:uppercase; color:var(--ink)}
  .wordmark span{color:var(--accent)}
  .wchip{display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; letter-spacing:.02em; color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 34%, transparent); border-radius:100px; padding:5px 11px;
    background:color-mix(in srgb,var(--accent) 8%, transparent);
    font-variant-numeric:tabular-nums}
  .wchip svg{width:12px; height:14px; display:block}
  .hello{font-family:var(--serif); font-size:26px; line-height:1.1; letter-spacing:.01em;
    color:var(--ink); margin:2px 0 0}
  .hello em{font-style:italic}
  .wnote{margin:0; font-size:12.5px; color:var(--ink-soft); letter-spacing:.01em}

  /* ---------------- masthead ---------------- */
  .masthead{padding:16px 22px 6px; border-top:1px solid var(--line-soft); margin-top:4px}
  .issue{display:flex; align-items:center; gap:8px;
    font-size:10.5px; font-weight:600; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .issue .dot{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.6}
  .title{font-family:var(--serif); font-weight:400; color:var(--ink);
    font-size:clamp(46px,15vw,58px); line-height:.9; letter-spacing:.005em;
    margin:8px 0 0; text-wrap:balance; display:flex; align-items:baseline; gap:10px}
  .title .drop{color:var(--accent); font-size:.5em; transform:translateY(-.28em)}
  .subhint{margin:12px 0 0; font-size:12px; color:var(--ink-soft); letter-spacing:.01em;
    display:flex; align-items:center; gap:7px}
  .subhint .tapdot{width:7px; height:7px; border-radius:50%; background:var(--accent)}

  /* ---------------- looks ---------------- */
  .looks{padding:14px 16px 8px; display:flex; flex-direction:column; gap:12px}
  .look{-webkit-appearance:none; appearance:none; text-align:left; cursor:pointer;
    background:var(--paper-2); color:inherit; font:inherit;
    border:1px solid var(--line-soft); border-radius:20px; overflow:hidden; padding:0;
    display:flex; flex-direction:column;
    transition:transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s, border-color .28s}
  .look:hover{transform:translateY(-2px); box-shadow:0 14px 26px -18px var(--shadow)}
  .look:focus-visible{outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 34%,transparent)}
  .look.selected{border-color:var(--accent)}

  .plate{position:relative; aspect-ratio:5/4; overflow:hidden}
  .plate-1{background:linear-gradient(148deg,#AEB6B8 0%,#7E8891 62%,#67717A 100%)}
  .plate-2{background:linear-gradient(160deg,#BBB8AF 0%,#8E8C84 58%,#76797D 100%)}
  .plate-3{background:linear-gradient(150deg,#C6BFB1 0%,#9F9C92 55%,#85837E 100%)}
  .plate::after{content:""; position:absolute; inset:0; mix-blend-mode:overlay; opacity:.5;
    background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,.5) 0, transparent 1px),
                     radial-gradient(circle at 70% 60%, rgba(0,0,0,.4) 0, transparent 1px);
    background-size:4px 4px, 5px 5px}
  .plate .watermark{position:absolute; left:16px; bottom:12px; margin:0;
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:40px; line-height:.9; color:rgba(255,255,255,.9);
    text-shadow:0 1px 20px rgba(20,25,35,.35); letter-spacing:.01em}
  .plate .owntag{position:absolute; left:16px; top:14px;
    font-family:var(--sans); font-size:9.5px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; color:#fff;
    background:rgba(25,28,36,.34); backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,.4); border-radius:100px; padding:4px 9px}
  .stamp{position:absolute; top:12px; right:12px; width:46px; height:46px; border-radius:50%;
    display:grid; place-items:center;
    background:color-mix(in srgb,var(--paper) 84%, transparent); backdrop-filter:blur(4px);
    border:1.5px solid var(--stamp); color:var(--stamp);
    transform:scale(.5) rotate(-14deg); opacity:0;
    transition:transform .34s cubic-bezier(.2,1.5,.3,1), opacity .2s}
  .stamp svg{width:24px; height:24px}
  .look.selected .stamp{transform:scale(1) rotate(-8deg); opacity:1}

  .lmeta{padding:14px 16px 16px; display:flex; flex-direction:column; gap:5px}
  .leyebrow{font-size:10px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); font-variant-numeric:tabular-nums}
  .lname{font-family:var(--serif); font-weight:400; font-size:23px; line-height:1; margin:0; color:var(--ink)}
  .lcap{font-size:12.5px; line-height:1.5; color:var(--ink-soft); margin:2px 0 0; max-width:44ch}

  /* ---------------- nav ---------------- */
  .nav{display:flex; justify-content:space-around; align-items:center;
    padding:12px 24px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line-soft); margin-top:6px}
  .nav button{-webkit-appearance:none; appearance:none; background:none; border:0; cursor:pointer;
    font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.04em;
    color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px; padding:2px 6px}
  .nav button .ni{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.45}
  .nav button.on{color:var(--ink)}
  .nav button.on .ni{background:var(--accent); opacity:1}

  /* ---------------- toast ---------------- */
  .toast{position:absolute; left:50%; bottom:78px; transform:translate(-50%,14px); z-index:5;
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink); color:var(--paper);
    font-size:13px; font-weight:600; letter-spacing:.01em;
    padding:11px 18px; border-radius:100px; white-space:nowrap;
    box-shadow:0 12px 28px -12px var(--shadow);
    opacity:0; visibility:hidden; transition:opacity .32s, transform .32s, visibility .32s}
  .toast.show{opacity:1; visibility:visible; transform:translate(-50%,0)}
  .toast svg{width:15px; height:15px; color:var(--accent)}

  /* ---------------- caption under phone ---------------- */
  .foot{position:relative; z-index:1; max-width:392px; text-align:center;
    font-size:12px; line-height:1.55; color:color-mix(in srgb,var(--ink) 60%, var(--bg))}
  .foot b{color:color-mix(in srgb,var(--ink) 84%, var(--bg)); font-weight:600}

  /* ---------------- entrance ---------------- */
  .look{opacity:1; transform:none}
  .is-loaded .look{opacity:0; transform:translateY(16px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .is-loaded .look:nth-child(1){animation-delay:.06s}
  .is-loaded .look:nth-child(2){animation-delay:.16s}
  .is-loaded .look:nth-child(3){animation-delay:.26s}
  @keyframes rise{to{opacity:1; transform:none}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}
    70%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 0%,transparent)}
    100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}}
  .subhint .tapdot{animation:pulse 2.4s ease-out infinite}

  @media (prefers-reduced-motion:reduce){
    .is-loaded .look{opacity:1; transform:none; animation:none}
    .subhint .tapdot{animation:none}
    .look:hover{transform:none}
  }
</style>

<div class="stage" id="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="top">
        <div class="brandrow">
          <div class="wordmark">rain<span>·</span>ism</div>
          <div class="wchip" aria-label="현재 날씨 인천 22도 비">
            <svg viewBox="0 0 12 16" fill="none" aria-hidden="true"><path d="M6 1C6 1 1.5 6.6 1.5 10a4.5 4.5 0 0 0 9 0C10.5 6.6 6 1 6 1Z" fill="currentColor"/></svg>
            인천 22° 비
          </div>
        </div>
        <h1 class="hello">안녕, <em>유정</em>.</h1>
        <p class="wnote">비 오는 아침이에요. 오늘은 젖지 않게 골랐어요.</p>
      </div>

      <div class="masthead">
        <div class="issue">
          <span>Today’s Issue</span><span class="dot"></span><span>2026.7.8 WED</span>
        </div>
        <h2 class="title"><span class="drop">✶</span>RAINY EDIT</h2>
        <p class="subhint"><span class="tapdot" aria-hidden="true"></span>탭해서 오늘의 룩으로 저장하세요</p>
      </div>

      <div class="looks" id="looks">
        <button class="look" data-name="트렌치">
          <div class="plate plate-1">
            <span class="owntag">내 옷</span>
            <div class="stamp"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="watermark">Trench</p>
          </div>
          <div class="lmeta">
            <div class="leyebrow">Look 01</div>
            <h3 class="lname">발수 트렌치</h3>
            <p class="lcap">비 22°C · 발수 트렌치 한 장이면 종일 보송. 발끝은 첼시부츠로 물 걱정 컷.</p>
          </div>
        </button>

        <button class="look" data-name="원피스">
          <div class="plate plate-2">
            <span class="owntag">내 옷</span>
            <div class="stamp"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="watermark">Dress</p>
          </div>
          <div class="lmeta">
            <div class="leyebrow">Look 02</div>
            <h3 class="lname">린넨 원피스</h3>
            <p class="lcap">습도 높은 날 · 린넨 원피스로 끈적임 0. 냉방 대비 얇은 가디건만 챙기면 끝.</p>
          </div>
        </button>

        <button class="look" data-name="미니멀 셋업">
          <div class="plate plate-3">
            <span class="owntag">내 옷</span>
            <div class="stamp"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="watermark">Minimal</p>
          </div>
          <div class="lmeta">
            <div class="leyebrow">Look 03</div>
            <h3 class="lname">무채색 셋업</h3>
            <p class="lcap">오후 미팅까지 있는 날 · 무채색 셋업으로 격식 한 단계 자연스럽게 업.</p>
          </div>
        </button>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        오늘의 룩 저장됨
      </div>

      <nav class="nav" aria-label="하단 탭">
        <button class="on"><span class="ni"></span>오늘</button>
        <button><span class="ni"></span>날씨</button>
        <button><span class="ni"></span>옷장</button>
      </nav>

    </div>
  </div>

  <p class="foot">탭해보세요 — 오늘의 룩이 저장됩니다. <br>
  실제 앱에선 이 3룩이 <b>‘내가 가진 옷’(고스트 옷장)</b>으로 짜이고, 저장 기록이 착용 데이터·피드의 씨앗이 됩니다.</p>
</div>

<script>
  (function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var stage = document.getElementById('stage');
    if(!reduce){ requestAnimationFrame(function(){ stage.classList.add('is-loaded'); }); }

    var looks = Array.prototype.slice.call(document.querySelectorAll('.look'));
    var toast = document.getElementById('toast');
    var tHide;
    looks.forEach(function(btn){
      btn.setAttribute('aria-pressed','false');
      btn.addEventListener('click', function(){
        var already = btn.classList.contains('selected');
        looks.forEach(function(b){ b.classList.remove('selected'); b.setAttribute('aria-pressed','false'); });
        if(already){ hideToast(); return; }
        btn.classList.add('selected'); btn.setAttribute('aria-pressed','true');
        showToast('‘' + btn.getAttribute('data-name') + '’ · 오늘의 룩 저장됨');
      });
    });
    function showToast(msg){
      toast.childNodes[toast.childNodes.length-1].nodeValue = ' ' + msg;
      toast.classList.add('show');
      clearTimeout(tHide);
      tHide = setTimeout(function(){ toast.classList.remove('show'); }, 1900);
    }
    function hideToast(){ clearTimeout(tHide); toast.classList.remove('show'); }
  })();
</script>
