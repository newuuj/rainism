<!doctype html>
<meta charset="utf-8">
<title>스파이크① — 어느 임베딩이 '무드'를 잡나</title>
<!--
  구현계획 Phase 0 · 스파이크① (AGENTS §10 "착수 전 남은 것 3개" 중 첫 번째)
  ───────────────────────────────────────────────────────────────────────
  묻는 것: 사진을 숫자로 바꿔서(임베딩) 견주면 **'분위기가 비슷한 옷'을 실제로 찾아내는가?**
           찾아낸다면 **어느 모델이** 제일 잘 찾는가?

  왜 지금 재나: 프로토타입은 지금 **태그 점수로만** 3장을 고른다(임베딩 0줄).
                실측해보니 취향만 켠 사람에겐 **점수 종류가 4가지뿐**이라
                81장 중 13장이 1등 동점이 되고, 그중 누가 뽑히는지는 사실상 제비뽑기다.
                문서가 확정한 방식(이미지 임베딩 + 벡터 유사도)이 이걸 고칠 수 있는지 본다.

  어떻게 재나: 라이브러리 110장에는 사람이 매긴 **무드 라벨**(고프코어/Y2K/발레코어/모리룩)이 있다.
    ① 무드 적중률 — 한 장을 질의로 주고 가장 가까운 10장 중 **같은 무드가 몇 장인가**.
       ⚠️ 이 라벨은 정답이 아니라 **사람이 매긴 값**이다. 여기서 재는 건
          "임베딩이 사람의 무드 감각과 얼마나 겹치는가"이지 절대 정확도가 아니다.
    ② 랜덤 기준선 — 아무렇게나 10장 뽑았을 때 같은 무드가 몇 장일지. 이걸 못 넘으면 무의미하다.
    ③ 줄 세우기 해상도 — 온보딩 질의로 점수를 매겼을 때 **1등 동점이 몇 장**인가.
       태그는 지금 13장까지 동점이 난다. 임베딩은 연속값이라 여기서 갈려야 한다.

  돌리는 법: 웹서버로 열어야 한다(file:// 은 라이브러리를 못 받는다).
    python3 -m http.server 8899  →  http://localhost:8899/spike/spike1_mood_embedding.html
-->
<body style="font-family:system-ui,sans-serif;padding:18px;max-width:900px;line-height:1.6">
<h2 style="margin:0 0 4px">스파이크① — 어느 임베딩이 '무드'를 잡나</h2>
<p style="color:#666;margin:0 0 16px;font-size:14px">라이브러리 110장으로 잰다. 아래가 다 찍히면 끝.</p>
<pre id="log" style="font-size:13px;white-space:pre-wrap;background:#f7f7f9;padding:14px;border-radius:10px"></pre>

<script type="module">
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
window.__done = false; window.__result = {};

const LIB_URL = 'https://fzmyqsvxitnvfxwqkxsd.supabase.co/rest/v1/library_looks';
const LIB_KEY = 'sb_publishable_xq22Kx4qAt12NjmQ0u07kg_qZjz308H';

/* 재볼 모델들. 앞이 가볍고 뒤로 갈수록 무겁다.
   fashion-clip 은 패션 사진에 맞춰 다시 학습시킨 CLIP 이다 — 있으면 재고, 없으면 건너뛴다. */
const MODELS = [
  { id: 'Xenova/clip-vit-base-patch32', 이름: 'CLIP 기본(작은 조각)' },
  { id: 'Xenova/clip-vit-base-patch16', 이름: 'CLIP 기본(고운 조각)' },
  { id: 'Xenova/mobileclip_s2',         이름: 'MobileCLIP (폰용)' },
  { id: 'Marqo/marqo-fashionCLIP',      이름: 'FashionCLIP (패션 특화)' },
  { id: 'Marqo/marqo-fashionSigLIP',    이름: 'FashionSigLIP (패션 특화)' },
];

const K = 10;                    // 가장 가까운 몇 장을 볼 것인가
const cos = (a, b) => {          // 두 사진이 얼마나 닮았나 (1에 가까울수록 닮음)
  let d = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return d / (Math.sqrt(na) * Math.sqrt(nb));
};

/* ── 라이브러리 110장 받아오기 ───────────────────────────── */
async function loadLooks() {
  const r = await fetch(LIB_URL + '?select=*&active=eq.true', { headers: { apikey: LIB_KEY, Authorization: 'Bearer ' + LIB_KEY } });
  if (!r.ok) throw new Error('라이브러리를 못 받았습니다 (HTTP ' + r.status + ')');
  return (await r.json()).map(x => {
    const id = parseInt(String(x.image_path || '').match(/(\d+)\.jpg$/)?.[1] ?? '', 10);
    return (id && x.mood) ? { id, mood: x.mood, name: x.name } : null;
  }).filter(Boolean);
}

(async function run() {
  try {
    const { AutoProcessor, CLIPVisionModelWithProjection, RawImage } =
      await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5');

    const looks = await loadLooks();
    const moods = [...new Set(looks.map(l => l.mood))];
    const cnt = {}; looks.forEach(l => cnt[l.mood] = (cnt[l.mood] || 0) + 1);
    log(`라이브러리 ${looks.length}장 · 무드 ${moods.length}종`);
    log(moods.map(m => `  ${m} ${cnt[m]}장`).join('\n'));

    /* 기준선 — 아무렇게나 K장 뽑았을 때 같은 무드가 몇 장일지.
       (자기 자신은 빼므로 분모가 전체-1) */
    const base = looks.reduce((s, l) => s + (cnt[l.mood] - 1) / (looks.length - 1), 0) / looks.length;
    log(`\n랜덤 기준선: ${K}장 중 ${(base * K).toFixed(1)}장이 같은 무드 (${(base * 100).toFixed(0)}%)`);
    log('→ 이걸 못 넘으면 그 임베딩은 무드를 못 잡는 것이다.\n');

    /* 온보딩 질의를 흉내낸다 — 한 무드에서 3장을 골랐다고 치고 그 평균을 질의로 쓴다.
       (실제 온보딩도 컨셉별 3장을 보여주고 마음에 드는 걸 고르게 한다) */
    const QUERY_MOOD = moods[0];
    const queryIds = looks.filter(l => l.mood === QUERY_MOOD).slice(0, 3).map(l => l.id);

    const rows = [];
    for (const M of MODELS) {
      const t0 = performance.now();
      let proc, model;
      try {
        proc = await AutoProcessor.from_pretrained(M.id);
        model = await CLIPVisionModelWithProjection.from_pretrained(M.id, { dtype: 'q8' });
      } catch (e) {
        log(`⏭  ${M.이름} — 못 받았습니다 (${String(e.message).slice(0, 60)})\n`);
        continue;
      }
      const ready = Math.round((performance.now() - t0) / 1000);

      const t1 = performance.now();
      const vecs = {};
      for (const l of looks) {
        const img = await RawImage.read(`../prototype/proto_img/${String(l.id).padStart(2, '0')}.jpg`);
        const out = await model(await proc(img));
        /* 모델마다 나오는 칸 이름이 다르다 — CLIP 계열은 image_embeds,
           패션 모델(open_clip 변환본)은 그냥 last_hidden_state 로 나온다 */
        const t = out.image_embeds || out.image_embeddings || out.last_hidden_state || Object.values(out)[0];
        vecs[l.id] = Array.from(t.data);
      }
      const perImg = ((performance.now() - t1) / looks.length / 1000);

      /* ① 무드 적중률 — 각 장의 최근접 K장 중 같은 무드 비율 */
      let hit = 0;
      for (const l of looks) {
        const near = looks.filter(o => o.id !== l.id)
          .map(o => ({ mood: o.mood, s: cos(vecs[l.id], vecs[o.id]) }))
          .sort((a, b) => b.s - a.s).slice(0, K);
        hit += near.filter(n => n.mood === l.mood).length / K;
      }
      const p = hit / looks.length;

      /* ③ 줄 세우기 해상도 — 온보딩 질의(3장 평균)로 점수를 매겼을 때 1등 동점 수 */
      const dim = vecs[looks[0].id].length;
      const q = new Array(dim).fill(0);
      queryIds.forEach(id => vecs[id].forEach((v, i) => q[i] += v / queryIds.length));
      const scored = looks.map(l => Math.round(cos(q, vecs[l.id]) * 1000) / 1000);
      const uniq = [...new Set(scored)].sort((a, b) => b - a);
      const tie = scored.filter(v => v === uniq[0]).length;

      const lift = p / base;
      log(`${lift >= 1.3 ? '✅' : lift >= 1.1 ? '△' : '❌'} ${M.이름}`);
      log(`    무드 적중률 ${(p * 100).toFixed(0)}% (${(p * K).toFixed(1)}/${K}장) · 랜덤 대비 ${lift.toFixed(2)}배`);
      log(`    점수 종류 ${uniq.length}가지 · 1등 동점 ${tie}장   (지금 태그 방식: 4가지 · 13장)`);
      log(`    모델 준비 ${ready}초 · 사진 한 장 ${perImg.toFixed(2)}초 · 110장 ${Math.round(perImg * 110)}초\n`);
      rows.push({ 모델: M.이름, id: M.id, 적중률: +(p * 100).toFixed(0), 랜덤대비: +lift.toFixed(2),
                  점수종류: uniq.length, 동점: tie, 준비초: ready, 장당초: +perImg.toFixed(2) });
    }

    const best = rows.slice().sort((a, b) => b.랜덤대비 - a.랜덤대비)[0];
    log('─'.repeat(52));
    log(best ? `제일 잘 잡은 것: ${best.모델} (랜덤 대비 ${best.랜덤대비}배)` : '잰 모델이 하나도 없습니다');
    window.__result = { 기준선: +(base * 100).toFixed(0), K, rows, best };
  } catch (e) {
    log('❌ ' + e.message);
    window.__result = { err: String(e.message) };
  }
  window.__done = true;
})();
</script>
</body>
